<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convention Center Navigation - NavMesh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #1a1a2e;
        }

        #pixiCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls-panel {
            width: 350px;
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        h2 {
            font-size: 18px;
            margin: 20px 0 10px;
            color: #4ecdc4;
            border-bottom: 2px solid #4ecdc4;
            padding-bottom: 5px;
        }

        .control-group {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid #00d4ff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b3e0ff;
            font-weight: 600;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        #path-info {
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid #4caf50;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        #path-info.visible {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .distance-display {
            font-size: 28px;
            font-weight: bold;
            color: #4caf50;
            text-align: center;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .path-steps {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
        }

        .path-step {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
        }

        .legend {
            margin-top: 20px;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            margin-left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(0, 212, 255, 0.7);
            transform: scale(1.1);
        }

        #event-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 1000;
            min-width: 200px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.5);
            display: none;
        }

        #event-tooltip.visible {
            display: block;
        }

        #event-tooltip h3 {
            color: #00d4ff;
            margin-bottom: 8px;
            font-size: 16px;
        }

        #event-tooltip p {
            margin: 5px 0;
            font-size: 13px;
            color: #b3e0ff;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container">
            <canvas id="pixiCanvas"></canvas>
            
            <div id="status">
                <div class="loading"></div>
                <span id="status-text">Initializing...</span>
            </div>

            <div class="controls-buttons">
                <button class="control-btn" id="zoomIn" title="Zoom In">+</button>
                <button class="control-btn" id="zoomOut" title="Zoom Out">−</button>
                <button class="control-btn" id="resetView" title="Reset View">⟲</button>
            </div>

            <div id="event-tooltip">
                <h3 id="tooltip-title"></h3>
                <p id="tooltip-content"></p>
            </div>
        </div>

        <div id="controls-panel">
            <h1>🗺️ NavMesh Navigation</h1>
            <p style="font-size: 13px; opacity: 0.8; margin-bottom: 20px;">
                Polygon-based pathfinding with crowd awareness
            </p>

            <div class="control-group">
                <h2>🎯 Plan Route</h2>
                
                <label for="startRoom">Start Location:</label>
                <select id="startRoom">
                    <option value="">Select starting hall...</option>
                </select>

                <label for="endRoom">Destination:</label>
                <select id="endRoom">
                    <option value="">Select destination...</option>
                </select>

                <button id="findPath">🧭 Find Shortest Path</button>
                <button id="clearPath" style="background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);">
                    🗑️ Clear Path
                </button>
            </div>

            <div id="path-info">
                <h2>📍 Route Information</h2>
                <div class="distance-display">
                    <span id="distance-meters">0</span> meters
                </div>
                <p style="text-align: center; font-size: 12px; opacity: 0.8;">
                    <span id="distance-pixels">0</span> pixels
                </p>
                <div class="path-steps" id="pathSteps"></div>
            </div>

            <div class="control-group">
                <h2>📊 System Info</h2>
                <p>Nodes: <span id="node-count">0</span></p>
                <p>Edges: <span id="edge-count">0</span></p>
                <p>Rooms: <span id="room-count">0</span></p>
            </div>

            <div class="legend">
                <h2>🎨 Legend</h2>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(239, 239, 239, 0.6);"></div>
                    <span>Halls/Rooms</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(158, 42, 43, 0.4);"></div>
                    <span>Walkable Corridors</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00d4ff;"></div>
                    <span>Selected Path</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4caf50; border-radius: 50%;"></div>
                    <span>Start Point</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f44336; border-radius: 50%;"></div>
                    <span>End Point</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="/static/app.js?v=20260131142005" defer></script>
</body>
</html>
