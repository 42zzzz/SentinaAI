# Mosquitto security baseline
# Implements NFR-26/27/28.

per_listener_settings true

# -----------------------------------------------------------------------------
# Secure MQTT (TLS)
# -----------------------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

allow_anonymous false

# TLS server certs (mounted by docker-compose)
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Recommended: mutual TLS (each device presents a client certificate)
require_certificate true
use_identity_as_username true

# Topic-level authorization
acl_file /mosquitto/config/aclfile

# NOTE: For password-based auth (instead of mTLS), create a second config that sets:
#   allow_anonymous false
#   password_file /mosquitto/config/passwords
# and disables require_certificate.
