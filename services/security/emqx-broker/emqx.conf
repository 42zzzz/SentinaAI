# EMQX single-node secure config (mTLS + ACL)
# - NFR-26: authenticate devices (mTLS)
# - NFR-27: restrict topics (ACL file)
# - NFR-28: TLS for MQTT

# Map client certificate identity to MQTT client properties.
# This prevents devices from spoofing clientid/username in CONNECT.
# (CN must match your deviceId / service name).
mqtt {
  peer_cert_as_clientid = "cn"      # "disabled" | "cn" | "dn" | "crt" | "pem" | "md5"
  peer_cert_as_username = "cn"      # optional; useful for dashboards/logs
}

# TLS listener (MQTTS)
listeners.ssl.default {
  bind = "0.0.0.0:8883"

  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile   = "/opt/emqx/etc/certs/emqx.crt"
    keyfile    = "/opt/emqx/etc/certs/emqx.key"

    # Enforce mutual TLS
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
}

# Optional: disable plain MQTT listener inside the container
# listeners.tcp.default { enable = false }

# Authorization via ACL file
authorization {
  no_match = deny
  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}
