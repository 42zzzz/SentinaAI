%% EMQX ACL file (Erlang tuples)
%% IMPORTANT: Rules are matched top -> bottom.
%% With mqtt.peer_cert_as_clientid="cn", clientid is forced to the cert CN.

%% Allow Node-RED to read telemetry and publish commands
{allow, {clientid, "nodered"}, subscribe, ["sentina/v1/telemetry/#"]}.
{allow, {clientid, "nodered"}, publish,   ["sentina/v1/cmd/#"]}.

%% Allow telemetry service to subscribe to all telemetry for sanitization/analytics
{allow, {clientid, "telemetry-service"}, subscribe, ["sentina/v1/telemetry/#"]}.

%% Devices: can only publish their own telemetry and only subscribe to their own command/config topics
%% Topic convention: sentina/v1/telemetry/<zoneId>/<deviceId>/<readingType>
{allow, all, publish,   ["sentina/v1/telemetry/+/${clientid}/#"]}.
{allow, all, subscribe, ["sentina/v1/cmd/${clientid}/#", "sentina/v1/config/${clientid}/#"]}.

%% Deny everything else
{deny, all}.
