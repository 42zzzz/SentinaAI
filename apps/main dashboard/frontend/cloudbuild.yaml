steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--build-arg'
      - 'VITE_API_BASE_URL=$_VITE_API_BASE_URL'
      - '--build-arg'
      - 'VITE_DIGITAL_TWIN_URL=$_VITE_DIGITAL_TWIN_URL'
      - '--build-arg'
      - 'VITE_NAV_URL=$_VITE_NAV_URL'
      - '-t'
      - '$_IMAGE'
      - '.'
images:
  - '$_IMAGE'
